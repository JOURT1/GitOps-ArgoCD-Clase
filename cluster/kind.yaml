kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
name: gitops-clase
nodes:
  - role: control-plane
    image: kindest/node:v1.32.2
    extraPortMappings:
      - containerPort: 30080
        hostPort: 14580
        listenAddress: "127.0.0.1"
      - containerPort: 30090
        hostPort: 14500
        listenAddress: "127.0.0.1"
