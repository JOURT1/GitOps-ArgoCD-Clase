apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: hola-gitops
  namespace: argocd
spec:
  project: clase-gitops
  source:
    repoURL: https://github.com/JOURT1/GitOps-ArgoCD-Clase.git
    targetRevision: main
    path: k8s
  destination:
    server: https://kubernetes.default.svc
    namespace: demo-clase
  syncPolicy:
    automated:
      enabled: true
      prune: true
      selfHeal: true
    retry:
      limit: 3
      backoff:
        duration: 5s
        factor: 2
        maxDuration: 30s
