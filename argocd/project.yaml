apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: clase-gitops
  namespace: argocd
spec:
  description: Demostracion aislada de GitOps para la clase
  sourceRepos:
    - https://github.com/JOURT1/GitOps-ArgoCD-Clase.git
  destinations:
    - namespace: demo-clase
      server: https://kubernetes.default.svc
  namespaceResourceWhitelist:
    - group: apps
      kind: Deployment
    - group: apps
      kind: ReplicaSet
    - group: ""
      kind: Pod
    - group: ""
      kind: Service
    - group: ""
      kind: ConfigMap
  clusterResourceWhitelist: []
