apiVersion: v1
kind: ConfigMap
metadata:
  name: pagina-gitops
  namespace: demo-clase
data:
  index.html: |
    <!doctype html><html lang="es"><meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>Hola, clase | GitOps</title>
    <style>body{margin:0;min-height:100vh;display:grid;place-items:center;background:#f5f3ec;color:#163b3c;font:22px system-ui}main{max-width:760px;padding:60px}small{font-size:15px;letter-spacing:.15em}h1{font-size:78px;line-height:1.05;letter-spacing:-.06em;margin:24px 0}p{line-height:1.7}code{font-size:17px;padding:12px 18px;background:#dfeae2;border-radius:8px;display:inline-block}</style>
    <main><small>DEMOSTRACIÓN REAL EN KUBERNETES</small><h1>Hola, clase.</h1>
    <p>Esta página se despliega desde un repositorio Git mediante Argo CD.
    Kubernetes mantiene las réplicas de la aplicación.</p>
    <code id="pod">Consultando el Pod que respondió...</code></main>
    <script>fetch('/pod.json',{cache:'no-store'}).then(r=>r.json()).then(x=>document.querySelector('#pod').textContent='Pod: '+x.pod)</script></html>
